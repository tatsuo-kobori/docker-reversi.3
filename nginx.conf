server {
    listen 80;
    listen [::]:80;
    server_name reversi.hoge9.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    # http2 on;
    server_name reversi.hoge9.xyz;

    ssl_certificate /etc/letsencrypt/live/reversi.hoge9.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reversi.hoge9.xyz/privkey.pem;

    location / {
        root /var/www/html/vhosts/hoge9.xyz/reversi.docker/reversi.client/dist;
        try_files $uri $uri/ /index.html;
    }

    location /socket.io/ {
        proxy_pass http://localhost:4100/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
